steer:
  max_left: 250
  degreess_max_left: 35
  max_right: 1300
  degreess_max_right: -35
  zero: 746
wheels:
  width: 0.7
  length: 1.25
  diameter: 0.45
  gear_ratio: 1
  active:
  - FL
  - FR
  - RL
  - RR
  reference_wheel: RL
  direction:
    FL: 0
    FR: 1
    RL: 0
    RR: 1
lift:
  up_position: 800
  down_position: 1100
toolbar:                     # control/toolbar_service, metres from centre, +right
  actuator_enabled: false    # monitor only until the actuator is wired; or `toolbar/cmd enable`
  firmware: solbot_main      # solbot_main (metres) | main_esp32_pio (solbot4, counts)
  device_name: ESP32_solbot_main
  min_position: -0.10        # soft limits enforced by the node (keep inside firmware u_min/u_max)
  max_position: 0.10
  center_position: 0.0
  sensor_margin: 0.02        # TBS beyond limits by more than this = sensor fault
  position_tolerance: 0.005  # at_target / in_motion threshold
  cmd_timeout_s: 1.0         # auto stream silence before holding
  sensor_timeout_s: 1.0
  jam_tolerance: 0.01        # jam if error > this ...
  jam_progress: 0.003        # ... and it moved less than this ...
  jam_timeout_s: 3.0         # ... for this long
drive:
  speed_multiplier: 5
planter:
  desired_density: 40
  aospr: 50
imu:
  yaw_offset: 1.73469
iso_current:
  enabled: true
  gain: 1.0
  max_correction_rpm: 25.0
  iq_deadband_a: 2.0
  min_turn_angle: 0.1
