# OAK-D (solbot4, lift DOWN, 1280x720) <-> sliding toolbar calibration, 2026-11-07.
# Reference point: bottom-left corner of the LEFT wing of the hoeing knife (left edge, just above the floor).
# Method: toolbar swept -0.08..+0.08..-0.08..0 m, corner found as bottom-left extreme of the
# saturated-black blade mask (S>50, V<95, above the tape), docs/toolbar_cam_calib/.
#
#   u_impl(p, dir) = u0 + px_per_m * p + dir * hysteresis_px / 2
#     p   = /toolbar/state current_position [m, +right]
#     dir = +1 if the last move was +p (toward image right), -1 if -p
#   The knife is in view only for p <= ~+0.01 m (it leaves the image on the right).
#
# Data (p m, u px, dir): -0.0795 858 -1 | -0.0406 942 +1 | -0.0006 1045.7 +1 | +0.0006 1096.7 -1
#                        -0.0394 980 -1 | -0.0795 858 -1 | -0.0006 1045.3 +1   residuals <= 8.5 px
bar_follower:
  ros__parameters:
    image_width: 1280
    image_height: 720
    v_ref: 580                # image row of the reference corner (556..584 during the sweep)
    u0: 1011.7                # px, p = 0, direction-averaged. Was 1071.7 with p = 0 at TPS 825; 2026-11-10
                              # toolbar zero moved to TPS 923 (p_old = p_new - 0.0206): 1071.7 - 2907*0.0206.
                              # The data above is in the OLD p frame.
    px_per_m: 2907.0          # knife image motion per toolbar metre (+p -> image right)
    px_per_m2: -2867.0        # 2026-11-10 sweep (docs/toolbar_cam_calib/follow_check_2026-11-10):
                              # u = 1009.6 + 2788 p - 2867 p^2. Used only for the markers-mode GAIN
                              # (px_per_m + 2*px_per_m2*p); model mode stays linear with u0/px_per_m.
    hysteresis_px: -40.3      # moving +p the knife lags ~40 px left (implement joint play, ~15 mm)
    ground_px_per_cm: 26.2    # tape at v~620, x 845..1107 (25.5 averaged over the full width)
    # --- follower (scripts/bar_follower.py); center_offset_mm, offset_mm, deadband_mm, dry_run live:
    #     bash pd600.sh ros2 param set /bar_follower deadband_mm 2.0
    reference: knives         # knives: two knives, keep the bar midway between their inner wing tips at
                              #   ground level (visual servo); markers: same with the yellow markers (5-10 cm
                              #   above ground: parallax, 22 mm off at 2026-11-11 setup); model: one knife
    center_offset_mm: 0.0     # knives/markers: bar this far right of the midpoint
    offset_mm: 30.0           # model: knife left edge this far RIGHT of the bar centre (+ = right)
    deadband_mm: 3.0          # no new target while |error| is below this
    servo: continuous         # markers: continuous = new target every frame from the toolbar position at
                              #   the image time (smooth motion); stepped = move, settle, measure, move
    servo_gain: 0.8           # continuous: fraction of the measured error applied per frame
    settle_s: 0.6             # stepped: toolbar still this long before the image is trusted
    settle_frames: 3          # stepped: median of this many settled frames per decision
    dry_run: true             # true = compute + status/debug image only, no /tool_bar_position_cmd
    limit_m: 0.095
    lost_timeout_s: 0.5       # bar not seen this long -> stop commanding (toolbar_service holds)
    smoothing: 0.5            # EMA weight of a new bar measurement
    debug_image_hz: 2.0       # /bar_follower/image/compressed (640x360 overlay)
