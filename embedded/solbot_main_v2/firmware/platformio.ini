; solbot_main v2 firmware — ESP32-S3-DevKitC-1 (N8 / N8R2 / N16R8)
; Upload & monitor through the DevKit's "UART" USB port (GPIO19/20 are used by the board).

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21
    adafruit/Adafruit BNO08x @ ^1.2

[env:solbot_main_v2]

[env:solbot_main_v2_ota]
upload_protocol = espota
upload_port = ${sysenv.OTA_HOST}
